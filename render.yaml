# Render Blueprint — the API only.
#
# No `databases:` block: this deployment reuses an EXISTING Render PostgreSQL
# instance (wallet-db) rather than creating its own, because the free tier
# allows a single free database per account.
#
# `fromDatabase:` cannot be used for that — it only resolves databases declared
# in this same Blueprint — so DATABASE_URL is marked `sync: false` and pasted
# once in the dashboard. See the "Sharing a database" section of README.md.
#
# The React client is NOT here; it deploys separately to Vercel.
#
# Apply with: Render dashboard -> New -> Blueprint -> pick this repository.

services:
  - type: web
    name: kanban-api
    runtime: python
    plan: free

    # MUST match the region wallet-db is in. Render's internal network is
    # per-region, so a service in another region cannot resolve the internal
    # database hostname at all.
    region: oregon

    rootDir: backend

    # Migrations run here rather than in a pre-deploy hook, which is a paid
    # instance feature. The trade-off: this runs against the live database while
    # the previous version is still serving. Fine for one instance and additive
    # migrations; move to preDeployCommand when the instance is upgraded.
    #
    # `pip install .` and not `-e ".[dev]"`: production has no use for pytest,
    # hypothesis or ruff, and an editable install buys nothing here.
    buildCommand: pip install . && alembic upgrade head

    # Render assigns $PORT and routes to it. Binding 0.0.0.0 rather than
    # loopback is what lets the platform reach the listener at all.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /docs

    envVars:
      - key: PYTHON_VERSION
        value: "3.13.7"

      # Set once in the Render dashboard: paste wallet-db's *Internal* Database
      # URL. Left out of this file deliberately — it carries credentials, and
      # this file is public.
      - key: DATABASE_URL
        sync: false

      # Every table this application owns lives in its own schema, so it can
      # share wallet-db without colliding: both applications can have a `users`
      # table, and each keeps a separate alembic_version. The schema is created
      # by alembic/env.py on first deploy.
      - key: DB_SCHEMA
        value: kanban

      # Render generates a strong value once and stores it. Never in git.
      - key: JWT_SECRET
        generateValue: true

      # Wildcard: the Vercel frontend is on a different origin, and preview
      # deployments each get their own URL. Safe here only because auth is a
      # Bearer token in a header, not a cookie, so a browser never attaches it
      # automatically. Tighten to an explicit origin list if auth ever moves to
      # cookies or allow_credentials is enabled.
      - key: CORS_ORIGINS
        value: "*"
